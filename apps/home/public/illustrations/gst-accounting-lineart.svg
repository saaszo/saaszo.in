<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#6451f1" />
      <stop offset="100%" stopColor="#4338ca" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" floodOpacity="0.08" floodColor="#0f172a" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="#ffffff" />
  
  <!-- Desk Base -->
  <line x1="50" y1="310" x2="550" y2="310" stroke="#0f172a" stroke-width="3" />
  <line x1="50" y1="325" x2="550" y2="325" stroke="#e2e8f0" stroke-width="2" />

  <!-- Center: Financial Dashboard Screen -->
  <g transform="translate(130, 80)">
    <!-- Stand -->
    <polygon points="155,200 185,200 195,230 145,230" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5" />
    
    <!-- Monitor Body -->
    <rect x="0" y="0" width="340" height="205" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="3.5" filter="url(#cardShadow)" />
    
    <!-- Header Bar -->
    <rect x="10" y="10" width="320" height="28" rx="6" fill="url(#indigoGrad)" />
    <text x="22" y="28" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="900">SAASZO GST &amp; P&amp;L HUB</text>
    
    <rect x="225" y="15" width="95" height="18" rx="5" fill="#10b981" />
    <text x="235" y="27" fill="#ffffff" font-family="system-ui" font-size="8" font-weight="800">CA AUDIT READY ✓</text>

    <!-- Left Sub-Card: Tax Filing Status -->
    <g transform="translate(20, 50)">
      <rect x="0" y="0" width="135" height="135" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
      
      <!-- GSTR-1 Filed Box -->
      <rect x="10" y="12" width="115" height="32" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
      <text x="18" y="26" fill="#0f172a" font-family="system-ui" font-size="8.5" font-weight="800">GSTR-1</text>
      <rect x="68" y="20" width="50" height="16" rx="4" fill="#10b981" />
      <text x="76" y="31" fill="#ffffff" font-family="system-ui" font-size="7.5" font-weight="800">FILED ✓</text>
      
      <!-- GSTR-3B Filed Box -->
      <rect x="10" y="52" width="115" height="32" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
      <text x="18" y="66" fill="#0f172a" font-family="system-ui" font-size="8.5" font-weight="800">GSTR-3B</text>
      <rect x="68" y="60" width="50" height="16" rx="4" fill="#10b981" />
      <text x="76" y="71" fill="#ffffff" font-family="system-ui" font-size="7.5" font-weight="800">FILED ✓</text>

      <!-- 1-Click JSON Export Button -->
      <rect x="10" y="92" width="115" height="32" rx="6" fill="url(#indigoGrad)" />
      <text x="22" y="112" fill="#ffffff" font-family="system-ui" font-size="8.5" font-weight="900">1-CLICK JSON ⤓</text>
    </g>

    <!-- Right Sub-Card: P&L & Balance Sheet Chart -->
    <g transform="translate(170, 50)">
      <rect x="0" y="0" width="150" height="135" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2" />
      
      <text x="12" y="20" fill="#0f172a" font-family="system-ui" font-size="9" font-weight="900">P&amp;L Net Growth</text>
      <text x="12" y="32" fill="#10b981" font-family="system-ui" font-size="12" font-weight="900">+34.8% YoY</text>

      <!-- Bar Chart Columns -->
      <g transform="translate(15, 45)">
        <rect x="0" y="45" width="18" height="35" rx="3" fill="#cbd5e1" />
        <rect x="25" y="30" width="18" height="50" rx="3" fill="#cbd5e1" />
        <rect x="50" y="20" width="18" height="60" rx="3" fill="#818cf8" />
        <rect x="75" y="5" width="18" height="75" rx="3" fill="url(#indigoGrad)" />
        <rect x="100" y="0" width="18" height="80" rx="3" fill="#10b981" />
        <line x1="0" y1="80" x2="120" y2="80" stroke="#0f172a" stroke-width="1.5" />
      </g>
    </g>
  </g>

  <!-- Left Float: Calculator (2D Line Art) -->
  <g transform="translate(45, 180)">
    <rect x="0" y="0" width="65" height="95" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" filter="url(#cardShadow)" />
    <rect x="8" y="8" width="49" height="18" rx="3" fill="#e0e7ff" stroke="#cbd5e1" stroke-width="1" />
    <text x="14" y="21" fill="#6451f1" font-family="monospace" font-size="9" font-weight="900">5,42,890</text>
    
    <!-- Buttons -->
    <g transform="translate(8, 34)" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1">
      <rect x="0" y="0" width="12" height="10" rx="2" />
      <rect x="18" y="0" width="12" height="10" rx="2" />
      <rect x="36" y="0" width="12" height="10" rx="2" fill="#6451f1" />
      
      <rect x="0" y="14" width="12" height="10" rx="2" />
      <rect x="18" y="14" width="12" height="10" rx="2" />
      <rect x="36" y="14" width="12" height="10" rx="2" fill="#6451f1" />
      
      <rect x="0" y="28" width="12" height="10" rx="2" />
      <rect x="18" y="28" width="12" height="10" rx="2" />
      <rect x="36" y="28" width="12" height="10" rx="2" fill="#10b981" />
      
      <rect x="0" y="42" width="30" height="10" rx="2" />
      <rect x="36" y="42" width="12" height="10" rx="2" />
    </g>
  </g>

  <!-- Right Float: CA Certificate Stamp -->
  <g transform="translate(485, 140)">
    <circle cx="35" cy="35" r="32" fill="#ffffff" stroke="#6451f1" stroke-width="2.5" filter="url(#cardShadow)" />
    <circle cx="35" cy="35" r="26" fill="none" stroke="#6451f1" stroke-width="1.5" stroke-dasharray="3 3" />
    <text x="24" y="32" fill="#6451f1" font-family="system-ui" font-size="8" font-weight="900">AUDIT</text>
    <text x="18" y="44" fill="#10b981" font-family="system-ui" font-size="8" font-weight="900">VERIFIED</text>
  </g>
</svg>