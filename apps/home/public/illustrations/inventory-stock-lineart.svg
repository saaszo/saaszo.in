<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#6451f1" />
      <stop offset="100%" stopColor="#4338ca" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" floodOpacity="0.08" floodColor="#0f172a" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="#ffffff" />
  
  <!-- Floor Grid -->
  <line x1="40" y1="330" x2="560" y2="330" stroke="#0f172a" stroke-width="3" />
  <line x1="40" y1="345" x2="560" y2="345" stroke="#e2e8f0" stroke-width="2" />

  <!-- Left: Industrial Storage Rack Shelves with Boxes -->
  <g transform="translate(60, 80)">
    <!-- Steel Frame Columns -->
    <rect x="0" y="0" width="12" height="250" fill="#334155" stroke="#0f172a" stroke-width="2" />
    <rect x="180" y="0" width="12" height="250" fill="#334155" stroke="#0f172a" stroke-width="2" />
    
    <!-- Shelf 1 (Top) -->
    <rect x="0" y="40" width="192" height="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="2" />
    <g transform="translate(20, 5)">
      <rect x="0" y="0" width="45" height="35" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
      <line x1="22" y1="0" x2="22" y2="35" stroke="#6451f1" stroke-width="2" stroke-dasharray="2 2" />
      
      <rect x="55" y="-5" width="50" height="40" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
      <rect x="65" y="10" width="28" height="12" rx="2" fill="url(#indigoGrad)" />
      
      <rect x="115" y="8" width="40" height="27" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
    </g>

    <!-- Shelf 2 (Middle) -->
    <rect x="0" y="120" width="192" height="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="2" />
    <g transform="translate(15, 75)">
      <rect x="0" y="0" width="60" height="45" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
      <text x="8" y="24" fill="#6451f1" font-family="system-ui" font-size="8" font-weight="900">RACK A-1</text>
      
      <rect x="70" y="5" width="50" height="40" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
      <circle cx="95" cy="25" r="8" fill="#e0e7ff" />
      
      <rect x="130" y="-8" width="35" height="53" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
    </g>

    <!-- Shelf 3 (Bottom) -->
    <rect x="0" y="200" width="192" height="10" fill="#e2e8f0" stroke="#0f172a" stroke-width="2" />
    <g transform="translate(20, 155)">
      <rect x="0" y="0" width="70" height="45" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
      <rect x="80" y="5" width="70" height="40" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
    </g>
  </g>

  <!-- Right: Stock Manager Character (2D Line Art) -->
  <g transform="translate(280, 100)">
    <!-- Manager Body -->
    <path d="M 50 230 L 50 140 Q 50 100 90 95 Q 130 100 130 140 L 130 230 Z" fill="#ffffff" stroke="#0f172a" stroke-width="3" />
    <!-- High-Vis Vest in Electric Indigo -->
    <path d="M 60 140 L 75 220 L 105 220 L 120 140 Z" fill="url(#indigoGrad)" stroke="#0f172a" stroke-width="2" />
    
    <!-- Neck & Head -->
    <rect x="82" y="70" width="16" height="25" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
    <circle cx="90" cy="50" r="26" fill="#ffffff" stroke="#0f172a" stroke-width="3" />
    <!-- Safety Hardhat / Cap -->
    <path d="M 62 48 Q 65 22 90 22 Q 115 22 118 48 Z" fill="url(#indigoGrad)" stroke="#0f172a" stroke-width="2" />
    <rect x="58" y="44" width="64" height="6" rx="3" fill="#0f172a" />
    
    <!-- Face -->
    <circle cx="82" cy="52" r="2.5" fill="#0f172a" />
    <circle cx="98" cy="52" r="2.5" fill="#0f172a" />
    <path d="M 84 62 Q 90 68 96 62" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />

    <!-- Hand Holding Tablet / Barcode Terminal -->
    <path d="M 60 140 Q 20 160 0 140" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round" />
    
    <!-- Inventory Tablet Display -->
    <g transform="translate(-50, 100)">
      <rect x="0" y="0" width="95" height="75" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" filter="url(#cardShadow)" />
      <rect x="6" y="6" width="83" height="14" rx="3" fill="url(#indigoGrad)" />
      <text x="12" y="16" fill="#ffffff" font-family="system-ui" font-size="7" font-weight="900">STOCK: 1,420</text>
      
      <!-- Batch & Expiry Tag -->
      <text x="8" y="32" fill="#0f172a" font-family="system-ui" font-size="7" font-weight="800">Batch #B-2026</text>
      <text x="8" y="42" fill="#64748b" font-family="system-ui" font-size="6.5">Exp: Dec 2027</text>
      
      <rect x="8" y="48" width="78" height="16" rx="4" fill="#10b981" />
      <text x="14" y="59" fill="#ffffff" font-family="system-ui" font-size="7" font-weight="800">OPTIMIZED IN STOCK ✓</text>
    </g>
  </g>

  <!-- Floating Alert Badge: Smart Stock Expiry -->
  <g transform="translate(435, 45)">
    <rect x="0" y="0" width="135" height="42" rx="12" fill="#ffffff" stroke="#6451f1" stroke-width="2.5" filter="url(#cardShadow)" />
    <circle cx="22" cy="21" r="10" fill="#e0e7ff" />
    <text x="18" y="25" fill="#6451f1" font-family="system-ui" font-size="11" font-weight="900">!</text>
    
    <text x="38" y="18" fill="#0f172a" font-family="system-ui" font-size="9" font-weight="900">SMART STOCK</text>
    <text x="38" y="30" fill="#6451f1" font-family="system-ui" font-size="7.5" font-weight="700">Expiry Alert Engine</text>
  </g>
</svg>