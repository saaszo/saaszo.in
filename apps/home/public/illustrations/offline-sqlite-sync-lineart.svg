<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#6451f1" />
      <stop offset="100%" stopColor="#4338ca" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#10b981" />
      <stop offset="100%" stopColor="#059669" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" floodOpacity="0.08" floodColor="#0f172a" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#ffffff" />
  
  <!-- Subtle Background Circles -->
  <circle cx="300" cy="200" r="160" fill="none" stroke="#e0e7ff" stroke-width="2" stroke-dasharray="6 6" />
  <circle cx="300" cy="200" r="220" fill="none" stroke="#f1f5f9" stroke-width="1.5" />

  <!-- Center: High-Tech SQLite Database Cylinder -->
  <g transform="translate(240, 110)">
    <!-- Base Plate -->
    <ellipse cx="60" cy="180" rx="75" ry="25" fill="#f8fafc" stroke="#0f172a" stroke-width="3" filter="url(#cardShadow)" />
    
    <!-- Cylinder Layers -->
    <!-- Layer 3 (Bottom) -->
    <path d="M 0 130 C 0 150 120 150 120 130 L 120 155 C 120 175 0 175 0 155 Z" fill="#ffffff" stroke="#0f172a" stroke-width="3" />
    <ellipse cx="60" cy="130" rx="60" ry="20" fill="#e0e7ff" stroke="#6451f1" stroke-width="2" />
    <circle cx="25" cy="142" r="3" fill="#10b981" />
    <circle cx="35" cy="142" r="3" fill="#6451f1" />
    
    <!-- Layer 2 (Middle) -->
    <path d="M 0 85 C 0 105 120 105 120 85 L 120 110 C 120 130 0 130 0 110 Z" fill="#ffffff" stroke="#0f172a" stroke-width="3" />
    <ellipse cx="60" cy="85" rx="60" ry="20" fill="#e0e7ff" stroke="#6451f1" stroke-width="2" />
    <circle cx="25" cy="97" r="3" fill="#10b981" />
    <circle cx="35" cy="97" r="3" fill="#6451f1" />
    
    <!-- Layer 1 (Top) -->
    <path d="M 0 40 C 0 60 120 60 120 40 L 120 65 C 120 85 0 85 0 65 Z" fill="#ffffff" stroke="#0f172a" stroke-width="3" />
    <ellipse cx="60" cy="40" rx="60" ry="20" fill="url(#indigoGrad)" stroke="#0f172a" stroke-width="3" />
    
    <!-- SQLite Logo Text on Top -->
    <text x="32" y="44" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="12" letter-spacing="1">SQLite</text>
  </g>

  <!-- Left: Laptop Running SaaSzo POS -->
  <g transform="translate(60, 160)">
    <!-- Screen Body -->
    <rect x="20" y="0" width="130" height="90" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="3" filter="url(#cardShadow)" />
    <!-- Display Content -->
    <rect x="28" y="8" width="114" height="74" rx="4" fill="#0f172a" />
    <rect x="34" y="14" width="40" height="6" rx="2" fill="#6451f1" />
    <rect x="34" y="24" width="70" height="4" rx="1" fill="#94a3b8" />
    <rect x="34" y="32" width="55" height="4" rx="1" fill="#94a3b8" />
    <rect x="34" y="40" width="80" height="4" rx="1" fill="#94a3b8" />
    <!-- Chart on Screen -->
    <line x1="85" y1="70" x2="95" y2="55" stroke="#10b981" stroke-width="2" />
    <line x1="95" y1="55" x2="105" y2="62" stroke="#10b981" stroke-width="2" />
    <line x1="105" y1="62" x2="120" y2="45" stroke="#10b981" stroke-width="2" />
    
    <!-- Keyboard Base -->
    <polygon points="5,90 165,90 175,108 0,108" fill="#ffffff" stroke="#0f172a" stroke-width="3" />
    <rect x="65" y="96" width="40" height="6" rx="2" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="1" />
    
    <!-- Label -->
    <rect x="35" y="118" width="100" height="22" rx="11" fill="#ffffff" stroke="#6451f1" stroke-width="2" />
    <text x="47" y="133" fill="#6451f1" font-family="system-ui" font-size="9" font-weight="900">100% OFFLINE</text>
  </g>

  <!-- Right: Cloud Database Sync Hub -->
  <g transform="translate(420, 140)">
    <!-- Cloud Icon -->
    <path d="M 40 60 A 25 25 0 0 1 80 40 A 35 35 0 0 1 130 50 A 25 25 0 0 1 140 85 L 30 85 A 25 25 0 0 1 40 60 Z" fill="#ffffff" stroke="#0f172a" stroke-width="3" filter="url(#cardShadow)" />
    
    <!-- Sync Arrow Inside Cloud -->
    <path d="M 75 55 A 15 15 0 0 1 95 65" fill="none" stroke="#6451f1" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="98,62 95,70 88,65" fill="#6451f1" />
    
    <path d="M 95 75 A 15 15 0 0 1 75 65" fill="none" stroke="#6451f1" stroke-width="2.5" stroke-linecap="round" />
    <polygon points="72,68 75,60 82,65" fill="#6451f1" />
    
    <!-- Sync Status Pill -->
    <rect x="25" y="100" width="120" height="24" rx="12" fill="url(#indigoGrad)" filter="url(#cardShadow)" />
    <circle cx="40" cy="112" r="4" fill="#10b981" />
    <text x="52" y="116" fill="#ffffff" font-family="system-ui" font-size="9" font-weight="800">CLOUD SYNCED</text>
  </g>

  <!-- Sync Flow Curved Lines -->
  <!-- Left to Center -->
  <path d="M 185 200 Q 215 190 235 200" fill="none" stroke="#6451f1" stroke-width="3" stroke-dasharray="4 4" />
  <polygon points="238,200 230,195 230,205" fill="#6451f1" />
  
  <!-- Center to Right -->
  <path d="M 365 200 Q 395 190 415 185" fill="none" stroke="#6451f1" stroke-width="3" stroke-dasharray="4 4" />
  <polygon points="418,185 410,180 410,190" fill="#6451f1" />

  <!-- Top Shield Badge: Zero Lag -->
  <g transform="translate(255, 30)">
    <polygon points="45,0 80,12 80,45 45,65 10,45 10,12" fill="#ffffff" stroke="#0f172a" stroke-width="3" filter="url(#cardShadow)" />
    <polygon points="45,6 74,16 74,42 45,58 16,42 16,16" fill="url(#indigoGrad)" />
    <path d="M 35 32 L 42 39 L 56 24" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>