<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#6451f1" />
      <stop offset="100%" stopColor="#4338ca" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" floodOpacity="0.08" floodColor="#0f172a" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="#ffffff" />
  
  <!-- Counter Line -->
  <line x1="50" y1="320" x2="550" y2="320" stroke="#0f172a" stroke-width="3" />
  <line x1="50" y1="335" x2="550" y2="335" stroke="#e2e8f0" stroke-width="2" />

  <!-- Left: Sleek Bluetooth POS Tablet on Stand -->
  <g transform="translate(70, 110)">
    <!-- Stand -->
    <polygon points="65,180 95,180 105,210 55,210" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5" />
    <!-- Tablet Frame -->
    <rect x="0" y="20" width="150" height="170" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="3" filter="url(#cardShadow)" />
    <!-- Screen Header -->
    <rect x="8" y="28" width="134" height="24" rx="6" fill="url(#indigoGrad)" />
    <text x="18" y="44" fill="#ffffff" font-family="system-ui" font-size="9" font-weight="900">SAASZO INVOICE</text>
    <circle cx="130" cy="40" r="3" fill="#10b981" />
    <!-- Tablet Invoice Lines -->
    <rect x="18" y="62" width="70" height="6" rx="3" fill="#0f172a" />
    <rect x="18" y="74" width="110" height="4" rx="2" fill="#94a3b8" />
    <rect x="18" y="84" width="95" height="4" rx="2" fill="#94a3b8" />
    <rect x="18" y="94" width="105" height="4" rx="2" fill="#94a3b8" />
    <!-- Print Button on Tablet -->
    <rect x="18" y="145" width="114" height="30" rx="8" fill="url(#indigoGrad)" />
    <text x="45" y="164" fill="#ffffff" font-family="system-ui" font-size="10" font-weight="800">PRINT BILL ⎙</text>
  </g>

  <!-- Bluetooth Wireless Waves between Tablet and Printer -->
  <g transform="translate(235, 170)">
    <circle cx="20" cy="20" r="4" fill="#6451f1" />
    <path d="M 30 10 A 15 15 0 0 1 30 30" fill="none" stroke="#6451f1" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 38 4 A 25 25 0 0 1 38 36" fill="none" stroke="#6451f1" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Right: 3-Inch Thermal Receipt Printer (ESC/POS) -->
  <g transform="translate(290, 140)">
    <!-- Printer Case -->
    <rect x="0" y="90" width="180" height="90" rx="14" fill="#ffffff" stroke="#0f172a" stroke-width="3.5" filter="url(#cardShadow)" />
    <!-- Feed Slot -->
    <rect x="25" y="96" width="130" height="10" rx="5" fill="#0f172a" />
    
    <!-- Controls & Status LEDs -->
    <circle cx="35" cy="145" r="5" fill="#10b981" />
    <text x="45" y="148" fill="#64748b" font-family="system-ui" font-size="8" font-weight="700">POWER</text>
    <rect x="110" y="136" width="48" height="20" rx="6" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" />
    <text x="120" y="150" fill="#0f172a" font-family="system-ui" font-size="8" font-weight="800">FEED</text>

    <!-- Long Dispensed Thermal Receipt Paper -->
    <g transform="translate(30, -70)">
      <path d="M 0 165 L 0 0 Q 0 -8 8 -8 L 112 -8 Q 120 -8 120 0 L 120 165 Z" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" filter="url(#cardShadow)" />
      
      <!-- Receipt Header -->
      <text x="25" y="16" fill="#0f172a" font-family="system-ui" font-weight="900" font-size="10">SAASZO RETAIL</text>
      <text x="32" y="28" fill="#64748b" font-family="system-ui" font-size="7">GSTIN: 29AABCU9603R1ZM</text>
      <line x1="12" y1="36" x2="108" y2="36" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="3 3" />
      
      <!-- Line Items -->
      <text x="14" y="48" fill="#0f172a" font-family="system-ui" font-size="7.5" font-weight="600">1x Premium Tea</text>
      <text x="88" y="48" fill="#0f172a" font-family="system-ui" font-size="7.5" font-weight="700">₹240</text>
      
      <text x="14" y="60" fill="#0f172a" font-family="system-ui" font-size="7.5" font-weight="600">2x Almond Cookies</text>
      <text x="88" y="60" fill="#0f172a" font-family="system-ui" font-size="7.5" font-weight="700">₹360</text>
      
      <line x1="12" y1="68" x2="108" y2="68" stroke="#0f172a" stroke-width="1.5" stroke-dasharray="3 3" />
      
      <!-- Total -->
      <text x="14" y="80" fill="#0f172a" font-family="system-ui" font-size="9" font-weight="900">TOTAL PAID</text>
      <text x="80" y="80" fill="#6451f1" font-family="system-ui" font-size="9" font-weight="900">₹600.00</text>

      <!-- Scannable UPI QR Code on Thermal Bill -->
      <g transform="translate(42, 90)">
        <rect x="0" y="0" width="36" height="36" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="1.5" />
        <!-- QR Eyes -->
        <rect x="4" y="4" width="8" height="8" fill="#0f172a" />
        <rect x="24" y="4" width="8" height="8" fill="#0f172a" />
        <rect x="4" y="24" width="8" height="8" fill="#0f172a" />
        <rect x="16" y="16" width="4" height="4" fill="#6451f1" />
        <rect x="24" y="24" width="6" height="6" fill="#0f172a" />
      </g>
      <text x="32" y="136" fill="#64748b" font-family="system-ui" font-size="6.5" font-weight="700">SCAN TO PAY UPI</text>

      <!-- Auto-Cutter Scissors Line -->
      <line x1="0" y1="150" x2="120" y2="150" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="4 4" />
      <text x="45" y="160" fill="#ef4444" font-family="system-ui" font-size="7" font-weight="800">✂ AUTO-CUT</text>
    </g>
  </g>

  <!-- Top Pill Badge: ESC/POS 3-Inch -->
  <g transform="translate(430, 40)">
    <rect x="0" y="0" width="130" height="30" rx="15" fill="url(#indigoGrad)" filter="url(#cardShadow)" />
    <text x="18" y="19" fill="#ffffff" font-family="system-ui" font-size="10" font-weight="900">3-INCH ESC/POS</text>
  </g>
</svg>