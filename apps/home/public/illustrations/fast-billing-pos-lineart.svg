<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#6451f1" />
      <stop offset="100%" stopColor="#4338ca" />
    </linearGradient>
    <linearGradient id="softIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#e0e7ff" />
      <stop offset="100%" stopColor="#c7d2fe" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" floodOpacity="0.08" floodColor="#0f172a" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="#ffffff" />
  
  <!-- Subtle Background Grid -->
  <g stroke="#f1f5f9" stroke-width="1.5" stroke-dasharray="4 4">
    <line x1="40" y1="80" x2="560" y2="80" />
    <line x1="40" y1="160" x2="560" y2="160" />
    <line x1="40" y1="240" x2="560" y2="240" />
    <line x1="40" y1="320" x2="560" y2="320" />
  </g>

  <!-- Retail Counter Desk -->
  <rect x="50" y="280" width="500" height="90" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="3" filter="url(#cardShadow)" />
  <line x1="50" y1="295" x2="550" y2="295" stroke="#e2e8f0" stroke-width="2" />

  <!-- Shelves on Wall (Backdrop) -->
  <line x1="70" y1="90" x2="220" y2="90" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
  <rect x="85" y="55" width="22" height="35" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
  <rect x="115" y="45" width="28" height="45" rx="3" fill="#f8fafc" stroke="#0f172a" stroke-width="2" />
  <rect x="150" y="60" width="20" height="30" rx="3" fill="#e0e7ff" stroke="#6451f1" stroke-width="2" />
  <rect x="178" y="50" width="24" height="40" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="2" />

  <!-- SaaSzo POS Terminal Screen -->
  <g transform="translate(180, 110)">
    <!-- Stand Base & Neck -->
    <polygon points="100,165 140,165 150,185 90,185" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5" />
    
    <!-- Monitor Body -->
    <rect x="20" y="20" width="200" height="145" rx="12" fill="#ffffff" stroke="#0f172a" stroke-width="3" filter="url(#cardShadow)" />
    
    <!-- Header Ribbon -->
    <path d="M 22 32 Q 22 22 32 22 L 208 22 Q 218 22 218 32 L 218 52 L 22 52 Z" fill="url(#indigoGrad)" />
    <text x="32" y="40" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="11" letter-spacing="0.5">SAASZO POS</text>
    <text x="135" y="40" fill="#c7d2fe" font-family="system-ui, sans-serif" font-weight="700" font-size="9">00:08s BILL</text>
    
    <!-- Screen Items -->
    <rect x="35" y="64" width="80" height="6" rx="3" fill="#0f172a" />
    <rect x="35" y="78" width="110" height="5" rx="2.5" fill="#94a3b8" />
    <rect x="35" y="90" width="95" height="5" rx="2.5" fill="#94a3b8" />
    <rect x="35" y="102" width="70" height="5" rx="2.5" fill="#94a3b8" />
    
    <!-- Summary Box -->
    <rect x="140" y="64" width="68" height="62" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5" />
    <text x="146" y="80" fill="#64748b" font-family="system-ui" font-size="8" font-weight="600">Total Bill</text>
    <text x="146" y="96" fill="#0f172a" font-family="system-ui" font-size="12" font-weight="900">₹1,499</text>
    
    <!-- Paid Pill -->
    <rect x="146" y="106" width="56" height="14" rx="4" fill="#10b981" />
    <text x="162" y="116" fill="#ffffff" font-family="system-ui" font-size="8" font-weight="800">PAID ✓</text>
  </g>

  <!-- Thermal Receipt Printer with Coming-Out Bill -->
  <g transform="translate(80, 205)">
    <!-- Printer Case -->
    <rect x="0" y="30" width="70" height="50" rx="8" fill="#ffffff" stroke="#0f172a" stroke-width="3" filter="url(#cardShadow)" />
    <rect x="12" y="38" width="46" height="5" rx="2.5" fill="#6451f1" />
    <circle cx="56" cy="62" r="3.5" fill="#10b981" />
    
    <!-- Receipt Paper -->
    <path d="M 16 35 L 16 -15 Q 16 -20 21 -20 L 49 -20 Q 54 -20 54 -15 L 54 35 Z" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
    <line x1="22" y1="-10" x2="48" y2="-10" stroke="#6451f1" stroke-width="2" stroke-linecap="round" />
    <line x1="22" y1="-2" x2="42" y2="-2" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="22" y1="6" x2="46" y2="6" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <line x1="22" y1="14" x2="38" y2="14" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" />
    <rect x="25" y="20" width="20" height="10" rx="2" fill="#e0e7ff" />
  </g>

  <!-- Cashier Character (2D Line Art) -->
  <g transform="translate(380, 100)">
    <!-- Body / Uniform Shirt -->
    <path d="M 50 180 L 50 120 Q 50 85 90 80 Q 130 85 130 120 L 130 180 Z" fill="url(#indigoGrad)" stroke="#0f172a" stroke-width="3" />
    
    <!-- Apron / Collar -->
    <polygon points="90,95 75,80 105,80" fill="#ffffff" stroke="#0f172a" stroke-width="2" />
    <text x="82" y="125" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="900">SZ</text>
    
    <!-- Neck -->
    <rect x="82" y="55" width="16" height="25" rx="3" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
    
    <!-- Head -->
    <circle cx="90" cy="38" r="26" fill="#ffffff" stroke="#0f172a" stroke-width="3" />
    
    <!-- Hair -->
    <path d="M 64 35 Q 68 12 90 12 Q 115 12 116 35 Q 108 22 90 22 Q 72 22 64 35 Z" fill="#0f172a" />
    
    <!-- Eyes & Smile -->
    <circle cx="82" cy="36" r="2.5" fill="#0f172a" />
    <circle cx="98" cy="36" r="2.5" fill="#0f172a" />
    <path d="M 84 46 Q 90 52 96 46" fill="none" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
    
    <!-- Left Hand Holding Laser Barcode Scanner -->
    <path d="M 60 110 Q 20 130 -20 105" fill="none" stroke="#0f172a" stroke-width="12" stroke-linecap="round" />
    
    <!-- Barcode Scanner -->
    <g transform="translate(-45, 80)">
      <rect x="10" y="10" width="24" height="32" rx="5" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" />
      <polygon points="10,20 -5,28 -5,12" fill="url(#indigoGrad)" stroke="#0f172a" stroke-width="2" />
      <!-- Laser Light Rays -->
      <polygon points="-5,20 -45,10 -45,30" fill="#6451f1" opacity="0.35" />
      <line x1="-5" y1="20" x2="-45" y2="10" stroke="#6451f1" stroke-width="1.5" stroke-dasharray="2 2" />
      <line x1="-5" y1="20" x2="-45" y2="30" stroke="#6451f1" stroke-width="1.5" stroke-dasharray="2 2" />
    </g>
  </g>

  <!-- Product Box with Barcode -->
  <g transform="translate(290, 195)">
    <rect x="0" y="0" width="55" height="75" rx="6" fill="#ffffff" stroke="#0f172a" stroke-width="2.5" filter="url(#cardShadow)" />
    <rect x="8" y="10" width="39" height="14" rx="3" fill="url(#indigoGrad)" />
    <text x="14" y="20" fill="#ffffff" font-family="system-ui" font-size="7" font-weight="800">PREMIUM</text>
    
    <!-- Barcode Stripes -->
    <g transform="translate(10, 42)" stroke="#0f172a" stroke-width="2">
      <line x1="0" y1="0" x2="0" y2="20" stroke-width="2" />
      <line x1="4" y1="0" x2="4" y2="20" stroke-width="1" />
      <line x1="8" y1="0" x2="8" y2="20" stroke-width="3" />
      <line x1="14" y1="0" x2="14" y2="20" stroke-width="1.5" />
      <line x1="18" y1="0" x2="18" y2="20" stroke-width="2" />
      <line x1="24" y1="0" x2="24" y2="20" stroke-width="3" />
      <line x1="30" y1="0" x2="30" y2="20" stroke-width="1" />
      <line x1="34" y1="0" x2="34" y2="20" stroke-width="2" />
    </g>
  </g>

  <!-- Floating Speed Lightning Badge -->
  <g transform="translate(480, 40)">
    <circle cx="30" cy="30" r="26" fill="#ffffff" stroke="#6451f1" stroke-width="2.5" filter="url(#cardShadow)" />
    <path d="M 33 16 L 20 32 L 28 32 L 26 44 L 40 28 L 32 28 Z" fill="#6451f1" stroke="#0f172a" stroke-width="1.5" />
  </g>
</svg>