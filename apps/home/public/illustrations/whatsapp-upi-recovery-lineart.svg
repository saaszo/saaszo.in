<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="indigoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#6451f1" />
      <stop offset="100%" stopColor="#4338ca" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#22c55e" />
      <stop offset="100%" stopColor="#16a34a" />
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" floodOpacity="0.08" floodColor="#0f172a" />
    </filter>
  </defs>

  <rect width="600" height="400" fill="#ffffff" />
  
  <!-- Subtle Background WhatsApp Bubbles -->
  <circle cx="100" cy="100" r="30" fill="#f0fdf4" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
  <circle cx="500" cy="280" r="40" fill="#e0e7ff" stroke="#6451f1" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Center: Smartphone with WhatsApp Chat & Payment Link -->
  <g transform="translate(195, 30)">
    <!-- Phone Outer Body -->
    <rect x="0" y="0" width="210" height="340" rx="32" fill="#ffffff" stroke="#0f172a" stroke-width="3.5" filter="url(#cardShadow)" />
    <!-- Dynamic Island / Speaker -->
    <rect x="75" y="10" width="60" height="8" rx="4" fill="#0f172a" />
    
    <!-- Screen Header (WhatsApp Style) -->
    <path d="M 4 36 L 206 36 L 206 72 L 4 72 Z" fill="#075e54" />
    <!-- Profile Avatar -->
    <circle cx="28" cy="54" r="14" fill="#ffffff" />
    <text x="23" y="58" fill="#075e54" font-family="system-ui" font-size="11" font-weight="900">S</text>
    <text x="48" y="52" fill="#ffffff" font-family="system-ui" font-size="10" font-weight="800">SaaSzo Invoicing</text>
    <text x="48" y="63" fill="#86efac" font-family="system-ui" font-size="7">✓ Verified Business</text>

    <!-- Chat Message Bubble (Green/White) -->
    <g transform="translate(14, 86)">
      <rect x="0" y="0" width="182" height="155" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" filter="url(#cardShadow)" />
      
      <!-- Greeting text -->
      <text x="12" y="18" fill="#0f172a" font-family="system-ui" font-size="8.5" font-weight="700">Hello Rahul Ji,</text>
      <text x="12" y="30" fill="#64748b" font-family="system-ui" font-size="7.5">Your bill for ₹1,499 is generated.</text>
      
      <!-- PDF Document Attachment Card -->
      <g transform="translate(10, 40)">
        <rect x="0" y="0" width="162" height="42" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
        <!-- Red PDF Icon -->
        <rect x="8" y="7" width="22" height="28" rx="3" fill="#ef4444" />
        <text x="12" y="24" fill="#ffffff" font-family="system-ui" font-size="8" font-weight="900">PDF</text>
        
        <text x="36" y="18" fill="#0f172a" font-family="system-ui" font-size="8" font-weight="800">INV_2026_089.pdf</text>
        <text x="36" y="29" fill="#94a3b8" font-family="system-ui" font-size="7">142 KB • 1 Page Bill</text>
      </g>

      <!-- Instant Pay via UPI Button -->
      <g transform="translate(10, 95)">
        <rect x="0" y="0" width="162" height="34" rx="8" fill="url(#indigoGrad)" />
        <!-- UPI Icon -->
        <circle cx="20" cy="17" r="8" fill="#ffffff" />
        <text x="16" y="20" fill="#6451f1" font-family="system-ui" font-size="7" font-weight="900">₹</text>
        
        <text x="36" y="21" fill="#ffffff" font-family="system-ui" font-size="10" font-weight="800">PAY ₹1,499 VIA UPI</text>
      </g>
      
      <text x="135" y="146" fill="#94a3b8" font-family="system-ui" font-size="7">10:42 AM ✓✓</text>
    </g>

    <!-- Bottom Instant Payment Received Notification -->
    <g transform="translate(14, 256)">
      <rect x="0" y="0" width="182" height="48" rx="12" fill="#10b981" filter="url(#cardShadow)" />
      <circle cx="24" cy="24" r="12" fill="#ffffff" />
      <path d="M 18 24 L 22 28 L 30 19" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" />
      
      <text x="42" y="20" fill="#ffffff" font-family="system-ui" font-size="9" font-weight="900">PAYMENT RECEIVED</text>
      <text x="42" y="32" fill="#dcfce7" font-family="system-ui" font-size="7.5">₹1,499 credited via GPay</text>
    </g>
  </g>

  <!-- Left Float: WhatsApp Icon Crest -->
  <g transform="translate(70, 160)">
    <circle cx="36" cy="36" r="32" fill="url(#emeraldGrad)" stroke="#0f172a" stroke-width="2.5" filter="url(#cardShadow)" />
    <!-- WhatsApp phone handset -->
    <path d="M 26 28 C 26 40 36 50 48 50 L 52 46 L 46 40 L 42 42 C 38 38 34 34 36 30 L 38 26 L 32 20 Z" fill="#ffffff" />
  </g>

  <!-- Right Float: Auto Reminder 3X Badge -->
  <g transform="translate(440, 90)">
    <rect x="0" y="0" width="115" height="42" rx="12" fill="#ffffff" stroke="#6451f1" stroke-width="2.5" filter="url(#cardShadow)" />
    <text x="16" y="20" fill="#6451f1" font-family="system-ui" font-size="11" font-weight="900">3X FASTER</text>
    <text x="16" y="32" fill="#64748b" font-family="system-ui" font-size="8" font-weight="600">Cash Recovery</text>
  </g>
</svg>